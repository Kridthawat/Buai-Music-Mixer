name: Build Buai Music Mixer installer (Windows x64 + x86 (32-bit))

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            qtarch: win64_msvc2019_64
          - arch: x86
            qtarch: win32_msvc2019
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 5.15.2 (MSVC 2019 ${{ matrix.arch }})
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: windows
          target: desktop
          arch: ${{ matrix.qtarch }}
          cache: true

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Build VSTChecker
        shell: cmd
        run: |
          mkdir build-vstchecker
          cd build-vstchecker
          qmake ..\3rdParty\VSTChecker\VSTChecker.pro CONFIG+=release
          nmake

      - name: Build Buai Music Mixer
        shell: cmd
        run: |
          mkdir build-mixer
          cd build-mixer
          qmake ..\BuaiMusicMixer.pro CONFIG+=release
          nmake

      - name: Compile translations
        shell: cmd
        run: lrelease languages\en.ts -qm languages\en.qm

      - name: Collect files (windeployqt + BASS)
        shell: pwsh
        run: |
          $arch = "${{ matrix.arch }}"
          $d = "deploy\$arch"
          $sub = if ($arch -eq "x64") { "x64\" } else { "" }
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item build-mixer\release\BuaiMusicMixer.exe $d
          Copy-Item (Get-ChildItem -Recurse build-vstchecker -Filter "VSTChecker_$arch.exe" | Select-Object -First 1).FullName $d
          $libs = @("bass24\bass.dll","bass_fx24\bass_fx.dll","bass_vst24\bass_vst.dll","bassmidi24\bassmidi.dll","bassmix24\bassmix.dll")
          foreach ($l in $libs) {
            $parts = $l.Split("\")
            Copy-Item ("BASS\" + $parts[0] + "\" + $sub + $parts[1]) $d
          }
          New-Item -ItemType Directory -Force "$d\languages" | Out-Null
          Copy-Item languages\en.qm "$d\languages"
          windeployqt --release --no-translations --no-system-d3d-compiler --no-opengl-sw "$d\BuaiMusicMixer.exe"
          Invoke-WebRequest "https://aka.ms/vs/17/release/vc_redist.$arch.exe" -OutFile "deploy\VC_redist.$arch.exe"

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=1.2.1" "_iss_setup\buai-mixer-${{ matrix.arch }}.iss"

      - uses: actions/upload-artifact@v4
        with:
          name: BuaiMusicMixer-setup-${{ matrix.arch }}
          path: dist\*.exe

